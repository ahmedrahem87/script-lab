---
- name: "STEP 1: Trial Configuration"
  hosts: all
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    ansible_network_os: cisco.iosxr.iosxr
    config_file: "configs/iosxr/isis_ldp.cfg"

  tasks:
    - name: Load config with 5-minute rollback timer
      ansible.netcommon.netconf_config:
        src: "{{ config_file }}"
        state: present
        confirm: 5  # Router will rollback in 5 mins unless Step 2 runs
