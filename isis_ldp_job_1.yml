---
- name: "STEP 1: Trial Configuration"
  hosts: all
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    ansible_network_os: cisco.iosxr.iosxr
    config_file: "configs/iosxr/isis_ldp.cfg"

  tasks:
    - name: Load config with 5-minute rollback timer
      ansible.netcommon.netconf_config:
        # FIXED: Changed 'src' to 'content' and wrapped in lookup
        content: "{{ lookup('file', config_file) }}"
        # FIXED: Removed 'state: present' (not supported by this module)
        # FIXED: Added 'format: text' to tell the router this is CLI-style text
        format: text
        confirm: 5
