---
- name: Test IOS-XR connectivity (network_cli)
  hosts: all
  gather_facts: no
  connection: network_cli

  vars:
    ansible_network_os: cisco.iosxr.iosxr

  tasks:
    - name: Run ip interface br
      ansible.netcommon.cli_command:
        command: show ip interface br
      register: router_output  # <-- ***THIS IS THE KEY CHANGE***

    - name: Print the captured command output
      ansible.builtin.debug:
        var: router_output.stdout_lines 


    - name: Check if any interface is Down
      ansible.builtin.fail:
        msg: "One or more interfaces are DOWN on {{ inventory_hostname }}"
      when: >
        router_output.stdout_lines
        | select('search', '\sDown\s+Down')
        | list
        | length > 0
 

