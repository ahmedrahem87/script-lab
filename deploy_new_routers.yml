---
- name: Deploy Intended Config to New Routers
  hosts: all
  connection: network_cli
  gather_facts: false
  # --- ADD THIS SECTION ---
  vars:
    ansible_network_os: cisco.ios.ios
  # -------------------------

  tasks:
    - name: Debug Variable Check
      debug:
        msg: "Targeting Device: {{ inventory_hostname }} with ID: {{ netbox_id }}"

    - name: Fetch Rendered Config from NetBox
      uri:
        url: "http://192.168.127.149:8000/api/dcim/devices/{{ netbox_id }}/render-config/"
        method: POST
        headers:
          Authorization: "Token 37429c9ca5c74ec0af0eeac134ea470905d09555"
        status_code: 200
      register: netbox_config

    - name: Save Rendered Config to Local File (Check Step)
      copy:
        content: "{{ netbox_config.json.content }}"
        dest: "/tmp/{{ inventory_hostname }}_intended.txt"
      delegate_to: localhost

    - name: Push Configuration to GNS3 Router
      cisco.ios.ios_config:
        lines: "{{ netbox_config.json.content.split('\n') }}"
        save_when: changed
      register: output
