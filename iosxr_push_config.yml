---
- name: Push IOS-XR configuration from file
  hosts: all
  gather_facts: no
  connection: network_cli

  vars:
    ansible_network_os: cisco.iosxr.iosxr
    config_file: "configs/iosxr/isis_ldp.cfg"

  tasks:
    - name: Push IOS-XR configuration
      ansible.netcommon.cli_config:
        config: "{{ lookup('file', config_file) }}"

    - name: Audit Hostname Change (Check Mode Only)
      cisco.iosxr.iosxr_config:  # FIXED: Changed from cisco.ios to cisco.iosxr
        lines:
          - hostname Test-iosxr
      check_mode: true           # FIXED: Corrected indentation
